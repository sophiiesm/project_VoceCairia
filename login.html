<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok — Programa de recompensas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="signup-page">

    <main class="signup-screen">
        <header class="simple-header">
            <button class="back-button" onclick="history.back()" aria-label="Voltar">‹</button>
            <strong>Programa de recompensas</strong>
            <span></span>
        </header>

        <section class="signup-card">
            <div class="tiktok-profile">
                <img src="imgs/perfiltiktok.png" alt="TikTok perfil">
            </div>

            <h1>Participar do programa</h1>
            <p class="signup-subtitle">
                Preencha seus dados básicos para continuar.
            </p>

            <form id="signupForm">
                <label for="name">Nome</label>
                <input
                    id="name"
                    name="name"
                    type="text"
                    placeholder="Digite seu nome"
                    autocomplete="on"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="on"
                    required
                >

                <button class="primary-button" type="submit">
                    Continuar
                </button>
            </form>

            <p class="tiny-note">
                Ao continuar, você será direcionado para a próxima etapa da participação.
            </p>
        </section>
    </main>

    <script>
        const form = document.getElementById("signupForm");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            /*
             * SIMULAÇÃO EDUCATIVA:
             * Os valores dos campos não são lidos, armazenados,
             * enviados para servidor ou usados para autenticação.
             */
            window.location.href = "resultado.html";
        });
    </script>
</body>
</html>
